# Java CI/CD Workflow with Maven, CodeQL, Docker, and EC2 Deployment
# For more information: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: ["add-license-1"]
  pull_request:
    branches: ["add-license-1"]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild Java project
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/my-java-app:${{github.sha}}
  deploy:
    name: Deploy to EC2
    needs: [analyze, build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker image on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOSTNAME }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo apt update
            sudo apt install docker.io -y
            sudo systemctl start docker
            sudo usermod -aG docker ubuntu
            sudo docker pull ${{ vars.DOCKER_USERNAME }}/my-java-app:${{ github.sha }}
            sudo docker stop my-java-app || true
            sudo docker rm my-java-app || true
            sudo docker run -d --name hello-world -p 80:5000 ${{ vars.DOCKER_USERNAME }}/my-java-app:${{ github.sha }}

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
    # - name: Update dependency graph
    #   uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

# File: .github/workflows/java-ci.yml

name: Java CI with Maven

on:
  push:
    branches: ["add-license-1"]
  pull_request:
    branches: ["add-license-1"]

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild Java project
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/my-java-app:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/my-java-app:latest

  deploy:
    name: Deploy to EC2
    needs: [analyze, build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker image on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOSTNAME }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Pull latest Docker image
            sudo docker pull ${{ vars.DOCKER_USERNAME }}/my-java-app:${{ github.sha }}

            # Stop and remove existing container if running
            sudo docker stop my-java-app || true
            sudo docker rm my-java-app || true

            # Run new container
            sudo docker run -d --name my-java-app-1 -p 80:5000 ${{ vars.DOCKER_USERNAME }}/my-java-app:${{ github.sha }}
